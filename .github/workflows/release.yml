name: Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit and create SBOM
        if: steps.release_check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit>=2.9,<3'
          pip-audit             --strict             -r requirements.lock             --format cyclonedx-json             --output "ServerBridge-$TAG.sbom.cdx.json"

      - name: Build source archives
        if: steps.release_check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git archive             --format=tar.gz             --prefix="ServerBridge-$TAG/"             "$GITHUB_SHA"             -o "ServerBridge-$TAG.tar.gz"

          git archive             --format=zip             --prefix="ServerBridge-$TAG/"             "$GITHUB_SHA"             -o "ServerBridge-$TAG.zip"

          sha256sum             "ServerBridge-$TAG.tar.gz"             "ServerBridge-$TAG.zip"             "ServerBridge-$TAG.sbom.cdx.json"             > SHA256SUMS.txt

      - name: Attest release artifacts
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ServerBridge-${{ steps.version.outputs.tag }}.tar.gz
            ServerBridge-${{ steps.version.outputs.tag }}.zip
            ServerBridge-${{ steps.version.outputs.tag }}.sbom.cdx.json
            SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG"             "ServerBridge-$TAG.tar.gz"             "ServerBridge-$TAG.zip"             "ServerBridge-$TAG.sbom.cdx.json"             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "ServerBridge $TAG"             --generate-notes
