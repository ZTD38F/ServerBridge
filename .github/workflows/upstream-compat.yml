name: Upstream compatibility

on:
  push:
    paths:
      - 'install.sh'
      - 'scripts/check-upstream-tunnel.sh'
      - '.github/workflows/upstream-compat.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/check-upstream-tunnel.sh'
      - '.github/workflows/upstream-compat.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel-client:
    name: Latest OpenAI tunnel-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release assets and required CLI
        run: bash scripts/check-upstream-tunnel.sh
