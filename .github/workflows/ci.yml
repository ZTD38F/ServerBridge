name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bash syntax
        run: |
          bash -n bootstrap.sh
          bash -n install.sh
          bash -n update.sh
          bash -n auto-update.sh
          bash -n uninstall.sh
          bash -n scripts/check-upstream-tunnel.sh
          bash -n tests/bootstrap_channels.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=180 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y shellcheck
          fi
          shellcheck -x bootstrap.sh install.sh update.sh auto-update.sh uninstall.sh scripts/check-upstream-tunnel.sh tests/bootstrap_channels.sh

      - name: Help path
        run: bash install.sh --help >/dev/null

      - name: Generated CLI template
        run: python tests/test_installer_templates.py

      - name: Full-access mode contracts
        run: python tests/test_access_mode_contract.py

      - name: Existing runtime credential reuse
        run: python tests/test_credentials_reuse.py

      - name: Interactive Tunnel ID and API key reuse
        run: python tests/test_interactive_credentials.py

      - name: Real Linux TTY credential prompts
        run: python tests/test_credential_prompt_tty.py

      - name: One-command piped bootstrap with real PTY prompts
        run: python tests/test_one_line_bootstrap_pty.py

      - name: Seamless update architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path
          install=Path("install.sh").read_text()
          updater=Path("serverbridge/update_engine.py").read_text()
          auto=Path("auto-update.sh").read_text()
          required_install=[
              "serverbridge-supervisor.service",
              "--mcp.server-url http://127.0.0.1:18766/mcp",
              "--mcp.extra-headers",
              "control_plane_api_key",
              "route.json",
          ]
          required_updater=[
              "CANDIDATE_HEALTHY","SWITCHED","DRAINING_OLD","OBSERVING",
              "FAILED_ROLLED_BACK","DEFERRED_STATEFUL_HANDLES",
              "update_supervisor","update_transport",
          ]
          for x in required_install:
              assert x in install, x
          for x in required_updater:
              assert x in updater, x
          assert "serverbridge.update_engine" in auto
          assert "bootstrap.sh" not in auto
          print("seamless update contract passed")
          PY

      - name: Bootstrap stable/edge channels
        run: bash tests/bootstrap_channels.sh

      - name: Fast release update, custom overlay hook and timer
        run: |
          bash tests/auto_update_fast_probe.sh
          python tests/test_update_components.py

      - name: Installer dry-run
        run: |
          sudo env \
            SERVERBRIDGE_TUNNEL_ID=tunnel_0123456789abcdef \
            CONTROL_PLANE_API_KEY=sk-test-placeholder \
            bash ./install.sh --dry-run

      - name: Install + rollback integration
        run: bash tests/install_integration.sh

      - name: Obvious secret scan
        run: |
          if grep -RInE --exclude-dir=.git             '(sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Potential secret detected." >&2
            exit 1
          fi

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install locked runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Compile
        run: python -m compileall -q serverbridge tests

      - name: Real MCP smoke test
        run: python tests/mcp_smoke.py

      - name: Nested credential audit redaction regression
        run: python -m unittest discover -s tests -p test_core_audit_redaction.py -v

      - name: Security boundary smoke test
        run: python tests/security_smoke.py

      - name: Supervisor watchdog recovery test
        run: python tests/supervisor_watchdog.py

      - name: Updater reconciliation test
        run: python tests/update_engine_reconcile.py

      - name: Release cache integrity regression
        run: python tests/test_staged_release_integrity.py

      - name: Process session admission and buffer regression
        run: python tests/test_sessions_integrity.py

      - name: Updater pre-switch failure cleanup regression
        run: python tests/test_updater_failure_cleanup.py

      - name: Real loopback HTTP supervisor E2E
        run: python tests/test_supervisor_http_e2e.py

      - name: Real-time SSE streaming E2E through supervisor
        run: python tests/test_supervisor_realtime_streaming.py

      - name: Real MCP initialize/tools-list/tools-call through HTTP router E2E
        run: python tests/test_mcp_tunnel_proxy_e2e.py

      - name: Automatic release proposal regression
        run: python -m unittest discover -s tests -p test_release_train.py -v

      - name: Automated delivery workflow security contracts
        run: python -m unittest discover -s tests -p test_release_workflow_contract.py -v

      - name: Manifest smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import serverbridge

          project = Path("pyproject.toml").read_text()
          version_line = next(
              (line for line in project.splitlines() if line.strip().startswith("version =")),
              None,
          )
          assert version_line, "project.version missing"
          expected = version_line.split("=", 1)[1].strip().strip('"')
          manifest = json.loads(Path("plugin.json").read_text())
          assert serverbridge.__version__ == expected
          assert manifest["version"] == expected
          print(f"Manifest/version smoke test passed: {expected}")
          PY


  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit>=2.9,<3'
          pip-audit -r requirements.lock --strict

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            prepare: >-
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              bash ca-certificates curl unzip tar gzip coreutils procps grep findutils
              python3 python3-venv python3-pip
          - name: Debian 12
            image: debian:12
            prepare: >-
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              bash ca-certificates curl unzip tar gzip coreutils procps grep findutils
              python3 python3-venv python3-pip
          - name: Fedora
            image: fedora:latest
            prepare: >-
              dnf install -y
              bash ca-certificates curl unzip tar gzip coreutils procps-ng grep findutils
              python3 python3-pip
          - name: Alpine
            image: alpine:latest
            prepare: >-
              apk add --no-cache
              bash ca-certificates curl unzip tar gzip coreutils procps grep findutils
              python3 py3-pip py3-virtualenv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Container compatibility smoke test
        env:
          IMAGE: ${{ matrix.image }}
          PREPARE: ${{ matrix.prepare }}
        run: |
          docker run --rm             -e SERVERBRIDGE_TUNNEL_ID=tunnel_0123456789abcdef             -e CONTROL_PLANE_API_KEY=sk-test-placeholder             -e PREPARE             -v "$PWD:/work:ro"             -w /work             "$IMAGE"             /bin/sh -c '
              set -eu
              sh -c "$PREPARE"
              bash -n bootstrap.sh install.sh update.sh uninstall.sh
              PYTHONPYCACHEPREFIX=/tmp/serverbridge-pycache python3 -m compileall -q serverbridge tests
              bash ./install.sh --dry-run
            '
