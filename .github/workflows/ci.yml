name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          bash -n bootstrap.sh
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n scripts/check-upstream-tunnel.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=180 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y shellcheck
          fi
          shellcheck -x bootstrap.sh install.sh update.sh uninstall.sh scripts/check-upstream-tunnel.sh

      - name: Help path
        run: bash install.sh --help >/dev/null

      - name: Generated CLI template
        run: python tests/test_installer_templates.py

      - name: Installer dry-run
        run: |
          sudo env             SERVERBRIDGE_TUNNEL_ID=tunnel_0123456789abcdef             CONTROL_PLANE_API_KEY=sk-test-placeholder             bash ./install.sh --dry-run

      - name: Obvious secret scan
        run: |
          if grep -RInE --exclude-dir=.git             '(sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Potential secret detected." >&2
            exit 1
          fi

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Compile
        run: python -m compileall -q serverbridge tests

      - name: Real MCP smoke test
        run: python tests/mcp_smoke.py

      - name: Security boundary smoke test
        run: python tests/security_smoke.py

      - name: Manifest smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import serverbridge

          assert serverbridge.__version__
          json.loads(Path("plugin.json").read_text())
          print("Manifest smoke test passed")
          PY
