name: Generate dependency lock

on:
  push:
    branches:
      - improve-ux-stability-v0.2
    paths:
      - '.github/workflows/generate-lock.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: improve-ux-stability-v0.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Generate hashed lock
        run: |
          python -m pip install --disable-pip-version-check 'pip-tools>=7.5,<8'
          pip-compile             --generate-hashes             --strip-extras             --resolver=backtracking             --output-file=requirements.lock             pyproject.toml

      - name: Commit lock
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "Lock file already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock
          git commit -m 'Lock Python dependencies with hashes'
          git fetch origin improve-ux-stability-v0.2
          git rebase origin/improve-ux-stability-v0.2
          git push origin HEAD:improve-ux-stability-v0.2
